<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipal</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pipal">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 16px;
    }
    h1 { font-size: 2.5rem; }
    p  { opacity: 0.6; line-height: 1.5; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: 24px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .install-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
      max-width: 320px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
    }
    .step-icon { font-size: 1.4rem; flex-shrink: 0; }
    .step-text { font-size: 0.9rem; opacity: 0.85; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="view-loading" hidden>
    <h1>Pipal</h1>
  </div>

  <div id="view-install" hidden>
    <h1>Pipal</h1>
    <p>Install this app on your iPhone to get started.</p>
    <div class="install-steps">
      <div class="step">
        <span class="step-icon">􀈂</span>
        <span class="step-text">Tap the <strong>Share</strong> button at the bottom of Safari</span>
      </div>
      <div class="step">
        <span class="step-icon">➕</span>
        <span class="step-text">Tap <strong>Add to Home Screen</strong></span>
      </div>
      <div class="step">
        <span class="step-icon">📱</span>
        <span class="step-text">Open <strong>Pipal</strong> from your home screen</span>
      </div>
    </div>
  </div>

  <div id="view-signin" hidden>
    <h1>Pipal</h1>
    <button class="btn" id="btn-signin">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.5l-6.5 5C9.5 39.5 16.3 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.6 35.4 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/>
      </svg>
      Sign in with Google
    </button>
  </div>

  <div id="view-unauthorized" hidden>
    <h1>Pipal</h1>
    <p>Only jonatan.wulcan@gmail.com and karin.wulcan@gmail.com have access.</p>
    <p id="unauthorized-signed-in-as" style="font-size:0.85rem; margin-top: 4px;"></p>
    <button class="btn btn-outline" id="btn-signout">Sign out and try again</button>
  </div>

  <div id="view-home" hidden>
    <h1>Pipal</h1>
    <p id="home-greeting"></p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';

    const ALLOWED = ['jonatan.wulcan@gmail.com', 'karin.wulcan@gmail.com'];

    const app = initializeApp({
      apiKey: 'AIzaSyAdcZU_5I3ix69F8RCBM0luvAlrNm79-hk',
      authDomain: 'pipal-app.firebaseapp.com',
      projectId: 'pipal-app',
      appId: '1:385517912582:web:4efba816df58149de2f987',
    });

    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    function show(id) {
      document.querySelectorAll('[id^="view-"]').forEach(el => { el.hidden = true; });
      document.getElementById(id).hidden = false;
    }

    if (!window.navigator.standalone) {
      show('view-install');
    } else {
      show('view-loading');

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          show('view-signin');
          return;
        }
        if (!ALLOWED.includes(user.email)) {
          document.getElementById('unauthorized-signed-in-as').textContent = `Signed in as ${user.email}`;
          show('view-unauthorized');
          return;
        }
        document.getElementById('home-greeting').textContent = `Hello ${user.email}`;
        show('view-home');
      });

      document.getElementById('btn-signin').addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (e) {
          console.error('Sign in failed', e);
        }
      });

      document.getElementById('btn-signout').addEventListener('click', () => signOut(auth));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
